name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Least privilege by default; a job that needs more asks for it.
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          for f in requirements-dev.txt requirements-embed.txt requirements-explore.txt requirements-lock.txt; do
            [ -f "$f" ] && pip install -r "$f" || true
          done

      - name: Dependency tree sanity
        run: pip check

      - name: Compile check
        run: python -m compileall -q .

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q tests/
          else
            echo "No tests/ directory; pip check + compileall already validated the import graph."
          fi
