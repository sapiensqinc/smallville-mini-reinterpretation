name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Least privilege by default; a job that needs more asks for it.
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          for f in requirements-dev.txt requirements-embed.txt requirements-explore.txt requirements-lock.txt; do
            [ -f "$f" ] && pip install -r "$f" || true
          done

      - name: Dependency tree sanity
        run: pip check

      - name: Compile check
        run: python -m compileall -q .

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q tests/
          else
            echo "No tests/ directory; pip check + compileall already validated the import graph."
          fi
