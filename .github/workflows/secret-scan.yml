# Scan the working tree and history for committed credentials.
#
# GitHub's own secret scanning is a paid product on private repositories, so
# this runs gitleaks instead. The published container is used directly rather
# than the gitleaks-action wrapper, because that wrapper requires a paid licence
# key for organisation-owned repositories. Nothing here leaves GitHub and no
# third-party account is involved.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: a credential that was committed and then removed is
          # still live until it is rotated.
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact=60 --exit-code=1
